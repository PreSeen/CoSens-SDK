name: Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosens-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and test
        run: |
          npm run build
          npm test
          git diff --exit-code -- dist
      - name: Check deployment authorization
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Configure the repository secret CLOUDFLARE_API_TOKEN with Cloudflare Pages Edit permission for the deployment account.'
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '32040609845cecfd444552c934feb7fb'
          wranglerVersion: '4.124.0'
          command: pages deploy dist --project-name cosens --branch main --commit-hash ${{ github.sha }}
      - name: Verify production content
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          COSENS_DEPLOY_COMMIT: ${{ github.sha }}
        run: npm run verify:live
      - name: Publish deployment receipt in run summary
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync,readFileSync} from 'node:fs';
          const receipt=readFileSync('.wrangler/deploy-receipt.json','utf8');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### CoSens production verified\n\n```json\n'+receipt+'\n```\n');
          JS

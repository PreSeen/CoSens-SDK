# Publishes a package when its release tag is pushed:
#   python-v<version>      -> PyPI cosens-sdk (python/pyproject.toml version)
#   typescript-v<version>  -> npm cosens-sdk (typescript/package.json version)
#
# PyPI uses Trusted Publishing (OIDC); no PyPI token is stored. The PyPI project must
# list this repository, this workflow file (release.yml) and the "pypi" environment as
# a Trusted Publisher. npm publishes with provenance using the organization secret
# NPM_TOKEN from an npm organization account, scoped to the "npm" environment.
name: Release

on:
  push:
    tags:
      - "python-v*"
      - "typescript-v*"

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "python-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Test
        run: |
          python -m pip install '.[test,agents]'
          PYTHONPATH=src python -m pytest tests
      - name: Build
        run: |
          rm -rf dist
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref_name, 'typescript-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "typescript-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

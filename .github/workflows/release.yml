# Publishes a package when its release tag is pushed:
#   python-v<version>      -> PyPI cosens-sdk (python/pyproject.toml version)
#   typescript-v<version>  -> npm cosens-sdk (typescript/package.json version)
#
# PyPI uses Trusted Publishing (OIDC); no PyPI token is stored. The PyPI project must
# list this repository, this workflow file (release.yml) and the "pypi" environment as
# a Trusted Publisher. npm publishes with provenance using the secret NPM_TOKEN (an npm
# granular access token with read and write permission that bypasses 2FA), stored in the
# "npm" environment or as an organization secret available to this repository.
# CONTRIBUTING.md describes the release steps.
name: Release

on:
  push:
    tags:
      - "python-v*"
      - "typescript-v*"

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "python-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Test
        run: |
          python -m pip install '.[test]'
          PYTHONPATH=src python -m pytest tests
      - name: Build
        run: |
          rm -rf dist
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref_name, 'typescript-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "typescript-v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Check the npm token is configured
        run: test -n "${NODE_AUTH_TOKEN}" || { echo "Secret NPM_TOKEN is not set for the npm environment"; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install
        run: npm ci
      - name: Build and test
        run: npm run check
      - name: Publish
        # A prerelease version (for example 0.11.0-rc.1) goes to the "next" dist-tag, not "latest".
        run: |
          version=$(node -p "require('./package.json').version")
          case "${version}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "${tag}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

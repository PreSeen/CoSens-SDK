[project]
name = "cosens-rsi"
version = "0.1.0"
description = "RSI workflow service with an internal Memory adapter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.10,<3",
  "memory>=0.1.0",
]

[project.scripts]
cosens-rsi = "cosens_rsi.cli:main"
cosens-rsi-mcp-stdio = "cosens_rsi.mcp_stdio:run"

[tool.uv]
package = true

[tool.setuptools.package-data]
cosens_rsi = ["static/*.html"]

[tool.uv.sources]
memory = { path = "packages/memory", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

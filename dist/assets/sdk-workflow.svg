<svg class="sdk-flow-svg" data-sdk-flow="" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 690" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Your experience changes how your agent works</title><desc id="diagram-desc">A seven-part animated story: you ask a question; project documents become relevant memory; your agent answers with context; your feedback informs a candidate method; validation precedes reuse on a new task. A scripted design preview.</desc><style>
:root.sdk-flow-svg{--bg:#f7f7f7;--sdk-bg:#efefef;--surface:#fbfbfb;--soft:#eee;--ink:#181818;--muted:#666;--line:#d4d4d4;--blue:#246bfe;--co:#383d45}
@media(prefers-color-scheme:dark){:root.sdk-flow-svg{--bg:#111;--sdk-bg:#181818;--surface:#161616;--soft:#1d1d1d;--ink:#eee;--muted:#9b9b9b;--line:#343434;--blue:#73a4ff;--co:#d1d5db}}
.sdk-flow-svg text{font-family:'DM Sans',Arial,sans-serif;fill:var(--ink)}.sdk-flow-svg .card{fill:var(--surface);stroke:var(--line);stroke-width:1}.sdk-flow-svg .soft{fill:var(--soft)}.sdk-flow-svg .node.active>.card{stroke:var(--blue)}.sdk-flow-svg .node.active .node-title{fill:var(--blue)}.sdk-flow-svg .kicker{font:10px 'IBM Plex Mono',monospace;letter-spacing:1.1px;fill:var(--muted)}.sdk-flow-svg .node-title{font-size:20px;font-weight:550;letter-spacing:-.5px}.sdk-flow-svg .body{font-size:14px}.sdk-flow-svg .muted{fill:var(--muted);font-size:12px}.sdk-flow-svg .icon{stroke:var(--muted);fill:none;stroke-width:1.1}.sdk-flow-svg .wire{fill:none;stroke:var(--line);stroke-width:1.1}.sdk-flow-svg .wire.active{stroke:var(--blue);stroke-width:1.7;stroke-dasharray:5 7;animation:sdk-travel 1.4s linear infinite}.sdk-flow-svg.paused .wire{animation-play-state:paused}.sdk-flow-svg .wire.reverse{animation-direction:reverse}.sdk-flow-svg .flow-label{font:10px 'IBM Plex Mono',monospace;fill:var(--blue);opacity:0;paint-order:stroke;stroke:var(--sdk-bg);stroke-width:5;stroke-linejoin:round;transition:opacity .25s}.sdk-flow-svg .flow-label.visible{opacity:1}.sdk-flow-svg .reason-label{fill:var(--muted);font-size:14px;font-weight:400}.sdk-flow-svg .co-region{fill:var(--sdk-bg);stroke:var(--line);stroke-dasharray:3 6;stroke-width:1}.sdk-flow-svg .status{opacity:0;transition:opacity .4s}.sdk-flow-svg .status.visible{opacity:1}.sdk-flow-svg .blue,.sdk-flow-svg .dot{fill:var(--blue)}@keyframes sdk-travel{to{stroke-dashoffset:-48}}@media(prefers-reduced-motion:reduce){.sdk-flow-svg .wire.active{animation:none}.sdk-flow-svg .status{transition:none}}
</style><defs><marker id="sdk-flow-arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 4 2.5L1 6" fill="none" stroke="context-stroke" stroke-width="1"/></marker></defs>
<rect class="co-region" x="388" y="58" width="736" height="559" rx="14"/>
<!-- Two aligned rows; the lower row uses three equal cards and equal gaps. -->
<path class="wire" data-path="conversation" d="M308 205H420" marker-end="url(#sdk-flow-arrow)"/>
<path class="wire" data-path="import" d="M308 510H420" marker-end="url(#sdk-flow-arrow)"/>
<path class="wire" data-path="recall" d="M560 435V320" marker-end="url(#sdk-flow-arrow)"/>
<path class="wire" data-path="learn" d="M952 320V435" marker-end="url(#sdk-flow-arrow)"/>
<path class="wire" data-path="experience" d="M700 510H812" marker-end="url(#sdk-flow-arrow)"/>
<text class="flow-label" data-flow-label="conversation" x="364" y="190" text-anchor="middle">Prompt</text>
<text class="flow-label" data-flow-label="import" x="364" y="495" text-anchor="middle"></text>
<text class="flow-label" data-flow-label="recall" x="575" y="377"></text>
<text class="flow-label" data-flow-label="learn" x="967" y="377"></text>
<text class="flow-label" data-flow-label="experience" x="756" y="495" text-anchor="middle"></text>
<g class="node" data-node="you"><rect class="card" x="28" y="90" width="280" height="230" rx="10"/><text x="52" y="123" class="kicker" id="you-kicker">YOUR QUESTION · YOUR GOAL</text><circle cx="62" cy="152" r="12" class="soft"/><circle cx="62" cy="148" r="3" class="icon"/><path d="M55 158q7-9 14 0" class="icon"/><text x="84" y="158" class="node-title">You</text><text x="52" y="213" class="body" id="question"><tspan x="52">Can we launch the pilot</tspan><tspan x="52" dy="25">on Friday?</tspan></text></g>
<g class="node" data-node="world"><rect class="card" x="28" y="435" width="280" height="150" rx="10"/><text x="52" y="467" class="node-title">Your experience</text><path class="icon" d="M53 490h10l5 5v15H53Zm10 0v6h5m-10 5h6"/><text x="80" y="505" class="body">Pilot plan.pdf</text><path class="icon" d="M53 516h10l5 5v15H53Zm10 0v6h5m-10 5h6"/><text x="80" y="531" class="body">Launch review.md</text><text x="52" y="563" class="muted">Documents · Notes · Apps*</text></g>
<g id="sensable-ai" data-sensable-region=""><text x="412" y="45" class="kicker" id="sdk-label"><tspan fill="var(--co)">Co</tspan><tspan fill="var(--blue)">Sens</tspan> SDK</text><text x="1100" y="45" text-anchor="end" class="kicker">REASON · REMEMBER · IMPROVE</text>
<g class="node" data-node="agent"><rect class="card" x="420" y="90" width="672" height="230" rx="10"/><text x="444" y="123" class="kicker" id="agent-kicker">YOUR AGENT</text><text x="444" y="158" class="node-title">Your agent <tspan class="reason-label">· Reason with your LLM</tspan></text><text x="1068" y="124" text-anchor="end" class="muted">ChatGPT · Claude · Codex · Claude Code</text><path d="M444 177H1068" class="wire"/><circle cx="454" cy="208" r="4" class="dot"/><text x="474" y="213" class="body" id="answer"><tspan x="474">Let’s work out the next step.</tspan></text><text x="444" y="299" class="muted">Reason with the context and methods that fit this task.</text></g>
<g class="node" data-node="memory"><rect class="card" x="420" y="435" width="280" height="150" rx="10"/><text x="444" y="467" class="node-title">Memory</text><text x="444" y="499" class="muted">What matters to you.</text><text x="444" y="563" class="muted" id="memory-line">Your project decisions and constraints.</text></g>
<g class="node" data-node="learn"><rect class="card" x="812" y="435" width="280" height="150" rx="10"/><text x="836" y="467" class="node-title">Learn</text><text x="1068" y="467" text-anchor="end" class="kicker">PREVIEW</text><text x="836" y="499" class="muted" id="method-line">A better approach, for next time.</text><g class="status" id="validation"><text x="836" y="563" class="kicker blue">DEVELOP → VALIDATE → REUSE</text></g></g>
<text x="420" y="663" class="kicker"><tspan fill="var(--co)">Co</tspan><tspan fill="var(--blue)">Sens</tspan> · EXPERIENCE LAYER</text><text x="1092" y="663" text-anchor="end" class="kicker">YOUR AGENT + MEMORY + LEARN</text></g>
</svg>

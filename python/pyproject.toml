[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cosens-sdk"
version = "0.4.2"
description = "CoSens Python SDK: record OpenAI and OpenAI Agents executions and generate reusable Recipes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "openai>=2.54,<2.55"]
keywords = ["cosens", "openai", "agents", "llm", "recipes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://cosens.ai/"
Documentation = "https://cosens.ai/docs/"
Repository = "https://github.com/PreSeen/CoSens-SDK"
Issues = "https://github.com/PreSeen/CoSens-SDK/issues"

[project.optional-dependencies]
agents = ["openai-agents>=0.20,<0.21"]
examples = ["openai-agents>=0.20,<0.21", "python-dotenv>=1,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "hatchling>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosens"]

[tool.hatch.build.targets.sdist]
only-include = ["src/cosens", "README.md", "pyproject.toml", "docs/api-reference.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

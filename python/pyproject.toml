[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cosens-sdk"
version = "0.10.1"
description = "CoSens Python SDK for cloud and local RSI and reusable Recipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "ruamel.yaml>=0.18.10,<0.20",
]
keywords = ["cosens", "openai", "agents", "llm", "recipes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://cosens.ai/"
Documentation = "https://cosens.ai/docs/"
Repository = "https://github.com/PreSeen/CoSens-SDK"
Issues = "https://github.com/PreSeen/CoSens-SDK/issues"

[project.optional-dependencies]
local-rsi = []
test = ["pytest>=8", "build>=1", "hatchling>=1.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosens"]

[tool.hatch.build.targets.sdist]
only-include = ["src/cosens", "README.md", "LICENSE", "NOTICE", "pyproject.toml", "docs/local-rsi.md", "examples/05_rsi_sdk_v2.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cosens-sdk"
version = "0.1.0"
description = "CoSens Python SDK for OpenAI and RSI workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "openai>=2.54,<2.55"]

[project.optional-dependencies]
agents = ["openai-agents>=0.20,<0.21"]
examples = ["openai-agents>=0.20,<0.21", "python-dotenv>=1,<2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cosens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

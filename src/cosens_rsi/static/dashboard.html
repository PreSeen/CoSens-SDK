<body>
<header class="top"><div class="brand"><div class="mark">Co</div>CoSens <span>Case · RSI 流程与效果</span></div><div class="top-actions"><span id="connection" class="small">未连接</span><button class="btn subtle" id="refresh">刷新</button><details class="settings" id="settings"><summary>连接设置</summary><div class="credentials"><label for="token">本地 RSI 访问令牌</label><input type="password" id="token" autocomplete="off" placeholder="输入访问令牌"><button class="btn" id="connect">连接</button> <button class="btn subtle" id="logout">断开</button><p>令牌保存在当前浏览器。可在本机 var/local.env 中找到 COSENS_RSI_TOKEN，页面不会公开其值。</p></div></details></div></header>
<div class="layout"><aside class="sidebar"><div class="side-heading"><span>业务 CASE</span><span id="case-count">—</span></div><input class="search" id="search" placeholder="搜索 Case" aria-label="搜索 Case"><div id="cases" class="case-list"><div class="muted" style="padding:12px">连接后加载真实任务</div></div></aside><main class="workspace"><div id="notice" class="notice" role="alert" hidden></div><div id="content"><div class="placeholder">连接本地 RSI 后，选择一个 Case<br>从业务目标、RSI 前后效果，一步步看到实际输入和输出。</div></div></main></div>
<dialog id="artifact-modal" class="modal"><div class="modal-top"><h2 id="artifact-title">交付物</h2><button class="btn subtle" id="close-modal">关闭</button></div><div id="artifact-content" class="modal-content"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const state={token:localStorage.getItem('cosens.rsi.token')||'',cases:[],caseId:new URLSearchParams(location.search).get('case')||'',data:null,runId:'',pairId:'',stepId:'',busy:false,request:0,open:new Set(),last:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crop=(v,n=170)=>{v=String(v||'');return v.length>n?v.slice(0,n)+'…':v};
const when=t=>t?new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未记录时间';
const statusName=s=>({completed:'已完成',passed:'已通过',ready:'进行中',pending:'进行中',waiting:'待执行',failed:'失败',cancelled:'已中止',rejected:'需修复',unknown:'未记录'}[s]||s);
const statusClass=s=>['passed','completed'].includes(s)?'good':['failed','rejected'].includes(s)?'warn':'blue';
const badge=(text,cl='')=>`<span class="badge ${cl}">${esc(text)}</span>`;
const isPrimary=a=>!a.auxiliary&&['markdown','html','csv'].includes(a.kind);
function message(text){$('#notice').hidden=!text;$('#notice').textContent=text||''}
async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+state.token},cache:'no-store'});if(!r.ok){if(r.status===401)throw Error('访问令牌无效，请在连接设置中重新输入。');throw Error(`请求失败（${r.status}），请稍后刷新。`)}return r.json()}
async function downloadRecipeFile(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+state.token},cache:'no-store'});if(!r.ok){if(r.status===401)throw Error('访问令牌无效，请在连接设置中重新输入。');throw Error(`Recipe 下载失败（${r.status}）。`)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(r.headers.get('Content-Disposition')?.match(/filename="([^"]+)"/)||[])[1]||'recipe.json';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url)}
async function downloadRecipe(runId){return downloadRecipeFile(`/v1/cases/${encodeURIComponent(state.caseId)}/runs/${encodeURIComponent(runId)}/recipe`)}
async function downloadCandidateRecipe(jobId){return downloadRecipeFile(`/v1/cases/${encodeURIComponent(state.caseId)}/improvements/${encodeURIComponent(jobId)}/recipe`)}
function fileButton(a){const symbol={markdown:'文档',html:'看板',csv:'表格',record:'记录',text:'文件'}[a.kind]||'文件';return `<button class="file" data-artifact="${esc(a.artifact_id)}"><span class="file-symbol">${symbol}</span><span class="file-name">${esc(a.name)}</span></button>`}
function renderCases(){const search=$('#search').value.trim().toLowerCase(),items=state.cases.filter(c=>c.title.toLowerCase().includes(search));$('#case-count').textContent=state.cases.length;$('#cases').innerHTML=items.length?items.map(c=>`<button class="case ${state.caseId===c.case_id?'active':''}" data-case="${esc(c.case_id)}"><div class="case-title">${esc(c.title)}</div><div class="case-meta"><span><i class="dot" style="background:${c.status==='completed'?'#26a174':'#d1a054'}"></i>${statusName(c.status)}</span><span>${c.run_count} 次执行</span><span>${when(c.updated_at)}</span></div></button>`).join(''):'<div class="muted" style="padding:14px">没有匹配的 Case</div>'}
function qualityEffectHtml(x){const delta=x.after_passed-x.before_passed;const summary=delta>0?`多通过 ${delta} 组`:delta<0?`少通过 ${-delta} 组`:'未观察到质量提升';const rows=checks=>checks.map(c=>`<tr><td>${esc(c.title)}</td><td>${badge(c.before?'通过':'失败',c.before?'good':'warn')}</td><td>${badge(c.after?'通过':'失败',c.after?'good':'warn')}</td></tr>`).join('');const changed=x.checks.filter(c=>c.before!==c.after);const key=state.caseId+':quality';return `<section class="panel"><div class="panel-head"><div><h2>RSI 前后效果 · 修复质量</h2><p>相同初始代码、公开需求与独立验收集；比较真实提交的补丁</p></div>${badge(x.recommendation_changed?'开发方式发生变化':'开发方式保持一致','blue')}</div><div class="effect"><div class="compare"><div class="compare-card"><div class="compare-label">使用经验前 · 首次修复</div><div class="route">${esc(x.before_route)}</div><div class="time">${x.before_passed}<span>/ ${x.total} 组通过</span></div><div class="small" style="margin-top:8px">${x.total-x.before_passed} 组业务边界未通过</div></div><div class="compare-card after"><div class="compare-label">使用已验证经验后 · 重新修复</div><div class="route">${esc(x.after_route)}</div><div class="time">${x.after_passed}<span>/ ${x.total} 组通过</span></div><div class="small" style="margin-top:8px">${x.total-x.after_passed} 组业务边界未通过</div></div></div><div class="gain"><div><div class="number" style="color:${delta>0?'var(--green)':delta<0?'#b34f38':'#718096'}">${delta>0?'+':''}${delta}<span style="font-size:14px"> 组</span></div><div class="caption">${esc(summary)}</div>${badge(x.regressed_checks?`${x.regressed_checks} 组出现退化`:'没有已通过场景退化',x.regressed_checks?'warn':'good')}</div></div></div><div class="evidence-tags">${badge('✓ 相同需求、初始代码和候选')}${badge(`${x.experience_count} 条已验证经验`)}${badge('真实 Codex 编码 · 业务仿真')}</div><div style="padding:0 22px 18px">${changed.length?`<table class="routes"><thead><tr><th>发生变化的业务边界</th><th>经验前</th><th>经验后</th></tr></thead><tbody>${rows(changed)}</tbody></table>`:'<div class="muted">验收结果没有变化；仅决策变化不足以证明质量改善。</div>'}<details class="tools" data-open="${key}" ${state.open.has(key)?'open':''}><summary>查看全部 ${x.total} 组独立验收结果</summary><table class="routes"><thead><tr><th>业务边界</th><th>经验前</th><th>经验后</th></tr></thead><tbody>${rows(x.checks)}</tbody></table></details></div><div class="scope">${esc(x.scope)} 冷启动同分时选第一项；训练预先分别探索两种方式。该对照没有估计模型随机波动。</div></section>`}
function recipeEvolutionHtml(x){
const key=state.caseId+':recipe-evolution';
const versions=(state.data?.runs||[]).filter((r,i,a)=>r.recipe_id&&a.findIndex(v=>v.recipe_id===r.recipe_id)===i).map(r=>`<button class="btn subtle" data-recipe-run="${esc(r.run_id)}">下载 Recipe v${esc(r.recipe_revision)}</button>`).join(' ');
const progress=x.progress.map(p=>badge(`${p.label}：${p.task_count} 个工单 / ${p.executions} 次已完成评测`,'blue')).join('');
const rows=x.pairs.map(p=>`<tr><td><button class="source-link" data-trace-pair="${esc(p.task_id)}">${esc(p.title.replace(/^请审核这个仿真售后工单：/,''))} · 查看前后 Trace</button></td><td>${p.before_passed}/${p.total}</td><td>${p.after_passed}/${p.total}</td><td>${((p.after_score-p.before_score)*100).toFixed(2)} 个百分点</td></tr>`).join('');
const pairDetails=x.pairs.map((p,i)=>{const open=key+':pair:'+i;const changed=p.checks.filter(c=>c.before!==c.after);return `<details class="history" data-open="${open}" ${state.open.has(open)?'open':''}><summary>${esc(crop(p.title.replace(/^请审核这个仿真售后工单：/,''),72))} · 查看输入、前后输出与检查</summary><div style="padding:0 22px 20px">${textBlock(p.input_text,open+':input')}<div class="io-grid subsection">${ioHtml([{label:'旧版 Recipe 的实际交付',artifacts:p.before_files}],'BEFORE · 原始版本',open+':before')}${ioHtml([{label:'候选 Recipe 的实际交付',artifacts:p.after_files}],'AFTER · 优化版本',open+':after')}</div>${changed.length?`<table class="routes subsection"><thead><tr><th>发生变化的业务检查</th><th>旧版</th><th>新版</th></tr></thead><tbody>${changed.map(c=>`<tr><td>${esc(c.title)}${c.critical?' · 关键约束':''}</td><td>${badge(c.before?'通过':'未通过',c.before?'good':'warn')}</td><td>${badge(c.after?'通过':'未通过',c.after?'good':'warn')}</td></tr>`).join('')}</tbody></table>`:'<div class="muted subsection">这份工单没有观察到质量变化。</div>'}<details class="tools subsection"><summary>全部 ${p.checks.length} 项检查</summary><table class="routes"><tbody>${p.checks.map(c=>`<tr><td>${esc(c.title)}</td><td>${c.before?'通过':'未通过'}</td><td>${c.after?'通过':'未通过'}</td></tr>`).join('')}</tbody></table></details></div></details>`}).join('');
const history=(x.previous_attempts||[]).length?`<details class="history"><summary>前期工程校验记录 · ${(x.previous_attempts||[]).length} 次未纳入质量结论的尝试</summary><div style="padding:0 22px 20px">${x.previous_attempts.map(a=>`<p class="small">${esc(a.reason)}</p>`).join('')}</div></details>`:'';
const changes=x.changes.map((c,i)=>`<details class="history" data-open="${key+':change:'+i}" ${state.open.has(key+':change:'+i)?'open':''}><summary>${c.selected?'采用的变更':'其他候选'} · ${esc(c.target)} / ${esc(c.slot)}${typeof c.screen_delta==='number'?' · 筛选变化 '+(c.screen_delta*100).toFixed(2)+' 个百分点':''}</summary><div class="io-grid" style="padding:0 22px 20px">${ioHtml([{label:'原方法',text:(c.before||[]).join('\n')}],'RECIPE BEFORE',key+':old:'+i)}${ioHtml([{label:'修改后的方法',text:Array.isArray(c.after)?c.after.join('\n'):String(c.after)}],'RECIPE AFTER',key+':new:'+i)}</div></details>`).join('');
return `<section class="panel" id="recipe-evolution"><div class="panel-head"><div><h2>Recipe 版本迭代与任务质量</h2><p>训练失败 → 生成候选方法 → 筛选 → 新工单确认 → 版本发布</p></div>${badge(x.status_text,['published','validated'].includes(x.status)?'good':'blue')}</div><div class="evidence-tags" style="padding-top:18px">${progress}</div>${x.available?`<div class="effect"><div class="compare"><div class="compare-card"><div class="compare-label">原始 Recipe · v${esc(x.before_revision)}</div><div class="time">${(x.before_score*100).toFixed(2)}<span>% 工单平均通过率</span></div></div><div class="compare-card after"><div class="compare-label">优化 Recipe · ${x.after_revision?'v'+esc(x.after_revision):'候选未发布'}</div><div class="time">${(x.after_score*100).toFixed(2)}<span>% 工单平均通过率</span></div></div></div><div class="gain"><div class="number">${x.delta>=0?'+':''}${(x.delta*100).toFixed(2)}</div><div class="caption">质量变化（百分点）</div>${badge(x.acceptance_path==='quality'?'独立质量门槛通过':x.reason||'未通过发布门槛',x.acceptance_path==='quality'?'good':'warn')}</div></div><div class="evidence-tags">${badge(`${x.improved} 份改善`,'good')}${badge(`${x.tied} 份持平`)}${badge(`${x.regressed} 份退化`,x.regressed?'warn':'good')}</div><div style="padding:0 22px 20px"><table class="routes"><thead><tr><th>确认工单（未用于生成候选）</th><th>旧版通过</th><th>新版通过</th><th>变化</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="no-effect">${esc(x.reason||'评测进行中，尚无可发布的 Recipe 质量结论。')}</div>`}<div style="padding:0 22px 18px">${versions}${x.candidate_hash&&!x.after_revision?` <button class="btn subtle" data-candidate-recipe="${esc(x.job_id)}">下载候选 Recipe（未发布）</button>`:''}${x.diagnosis?`<p class="small">训练阶段诊断：${esc(x.diagnosis)}</p>`:''}</div>${changes}${pairDetails}${history}<div class="scope">${esc(x.scope)}</div></section>`;
}
function effectHtml(c){if(c.recipe_evolution)return recipeEvolutionHtml(c.recipe_evolution);const x=c.comparison;if(x.available&&x.kind==='code_quality')return qualityEffectHtml(x);if(!x.available)return `<section class="panel"><div class="panel-head"><h2>RSI 前后效果</h2></div><div class="no-effect">${esc(x.reason)}</div></section>`;const reduction=x.reduction>=0?`下降 ${(x.reduction*100).toFixed(2)}%`:`增加 ${(-x.reduction*100).toFixed(2)}%`;return `<section class="panel"><div class="panel-head"><div><h2>RSI 前后效果</h2><p>同一 ${esc(x.period)} 任务，使用已验证经验前后的实际执行</p></div>${badge(x.recommendation_changed?'推荐发生变化':'推荐保持一致','blue')}</div><div class="effect"><div class="compare"><div class="compare-card"><div class="compare-label">使用经验前 · 基准</div><div class="route">${esc(x.before_route)}</div><div class="time">${x.before_seconds.toFixed(4)}<span>秒</span></div><div class="small" style="margin-top:8px">${x.trials[0]} 次测量的中位数</div></div><div class="compare-card after"><div class="compare-label">使用经验后</div><div class="route">${esc(x.after_route)}</div><div class="time">${x.after_seconds.toFixed(4)}<span>秒</span></div><div class="small" style="margin-top:8px">${x.trials[1]} 次测量的中位数</div></div></div><div class="gain"><div><div class="number">${x.speedup.toFixed(2)}<span style="font-size:14px"> ×</span></div><div class="caption">${esc(x.metric_label||"分析程序计算速度比")}</div>${badge(reduction,x.reduction>=0?'good':'warn')}</div></div></div><div class="evidence-tags">${badge('✓ 业务指标完全一致','good')}${badge('✓ 相同输入、候选与先验')}${badge(`${x.experience_count} 条已验证经验`)}${x.sla_seconds?badge(`批次目标 ${x.sla_seconds} 秒；首次${x.before_seconds<=x.sla_seconds?'达标':'超时'} → 本次${x.after_seconds<=x.sla_seconds?'达标':'超时'}`,x.after_seconds<=x.sla_seconds?'good':'warn'):''}</div><div class="scope">${esc(x.scope)}</div></section>`}
function expandedStages(run){const output=[];for(const s of run.stages){if(s.decisions?.length){const tools=s.tools||[];output.push({id:'decision:'+s.id,title:'RSI 策略选择',status:s.decisions.some(d=>d.actual!=='尚未记录')?'passed':'pending',summary:s.decisions.some(d=>!d.cold_start)?'使用已验证经验对候选路线重新排序':'没有可用的已验证经验，按初始评分选择',inputs:s.decisions.map(d=>({label:'当前观察',text:d.observation})),outputs:s.decisions.map(d=>({label:'推荐与实际执行',text:`推荐：${d.recommended}\n实际：${d.actual}`})),decisions:s.decisions,tools:tools.filter(t=>/request_guidance/.test(t.tool))});output.push({...s,decisions:[],tools:tools.filter(t=>!/request_guidance/.test(t.tool))})}else output.push(s)}return output}
function textBlock(text,key){text=String(text||'尚未记录');if(text.length<230)return `<div class="io-text">${esc(text)}</div>`;return `<div class="io-text">${esc(crop(text,195))}</div><details class="readmore" data-open="${esc(key)}" ${state.open.has(key)?'open':''}><summary>查看完整正文</summary><div class="full-text">${esc(text)}</div></details>`}
function artifactStack(cards,key){if(!cards?.length)return '<div class="muted">尚无保存的交付物</div>';const main=cards.filter(isPrimary),rest=cards.filter(a=>!isPrimary(a));const shown=main.length?main:cards.slice(0,3),more=main.length?rest:cards.slice(3);return `<div class="artifact-stack">${shown.map(a=>`<div>${fileButton(a)}<span class="file-sub">${esc(crop(a.summary,105))}</span></div>`).join('')}</div>${more.length?`<details class="auxiliary" data-open="${esc(key)}" ${state.open.has(key)?'open':''}><summary>其余 ${more.length} 个指标、核验及辅助文件</summary><div class="artifact-stack">${more.map(fileButton).join('')}</div></details>`:''}`}
function ioHtml(items,kind,key){return `<section class="io-box"><div class="io-title">${kind}</div>${(items||[]).map((v,i)=>`<div class="io-field"><label>${esc(v.label)}</label>${v.artifacts?artifactStack(v.artifacts,key+':'+i):textBlock(v.text,key+':'+i)}</div>`).join('')||'<div class="muted">尚未记录</div>'}</section>`}
function decisionsHtml(decisions){return (decisions||[]).map(d=>`<div class="subsection"><div class="decision-summary">${badge('推荐：'+d.recommended,'blue')}${badge('实际：'+d.actual,d.deviated?'warn':'good')}${badge(d.cold_start?'无已验证经验':'已使用历史经验')}</div><table class="routes"><thead><tr><th>候选路线</th><th>初始评分</th><th>RSI 调整后</th></tr></thead><tbody>${d.routes.map(r=>`<tr><td><strong>${esc(r.name)}</strong><span class="route-description">${esc(r.description)}</span>${r.sources.map(s=>s.run_id?`<button class="source-link" data-run="${esc(s.run_id)}">↳ 经验来源：${esc(crop(s.title,58))}</button>`:`<span class="file-sub">引用已验证的历史任务经验</span>`).join('')}</td><td>${Number(r.base_score).toFixed(3)}</td><td class="route-score">${Number(r.score).toFixed(3)}</td></tr>`).join('')}</tbody></table><div class="footer-note">评分用于路线排序，不是成功概率。经验来源可点击跳转到对应执行。</div>${d.basis==='avoided_negative_experience'?'<div class="callout">首次执行的已验证负反馈降低了旧路线评分，因此推荐另一条路线。新路线在本次执行前尚未验证；实际效果见完成后的核对和测量。</div>':''}${d.deviated?'<div class="callout">实际执行与 RSI 推荐不同。这里按真实动作记录，不将推荐当作已经执行。</div>':''}</div>`).join('')}
function toolsHtml(stage,key){const tools=stage.tools||[];if(!tools.length)return '<div class="footer-note">本步骤未单独采集工具日志；上方展示已保存的阶段输入与输出。</div>';return `<details class="tools subsection" data-open="${key}" ${state.open.has(key)?'open':''}><summary>查看 ${tools.length} 条真实执行记录</summary><div class="footer-note">按 Codex 原始日志顺序排列。日志没有逐条时间戳，因此不补造执行时间；凭证和内部结构字段已隐藏。</div>${tools.map((t,i)=>`<details class="tool" data-open="${key+':'+i}" ${state.open.has(key+':'+i)?'open':''}><summary><span>${i+1}. ${esc(t.tool)}</span>${badge(t.status==='failed'?'失败／后续可修复':'已记录',t.status==='failed'?'warn':'')}</summary><div class="tool-body"><h5>输入</h5><pre>${esc(t.input_text)}</pre><h5>输出</h5><pre>${esc(t.output_text)}</pre></div></details>`).join('')}</details>`}
function stepHtml(s,run){const key=state.caseId+':'+(run.trace_id||run.run_id)+':'+s.id;const memory=s.knowledge?.length?`<details class="tools subsection" data-open="${key+':memory'}" ${state.open.has(key+':memory')?'open':''}><summary>查看 ${s.knowledge.length} 条知识候选摘要</summary><div class="footer-note">检索候选不代表采用。业务结论仍应以执行简报与最终引用的资料为准。</div><div class="knowledge-list">${s.knowledge.map(k=>`<div class="knowledge"><strong>${esc(k.title)}</strong><p>${esc(k.text)}</p></div>`).join('')}</div></details>`:'';const writes=s.writebacks?.length?`<div class="subsection"><h4>经验沉淀状态</h4>${s.writebacks.map(w=>`<div class="writeback"><span>${esc(w.actual)}</span>${badge(w.write_status==='done'?'已写回 Memory':w.write_status==='failed'?'写回失败':'等待写回',w.write_status==='done'?'good':'warn')}${badge(w.reward_status==='verified'?'程序指标已独立验证':w.reward_status==='pending'?'奖励待验证':'尚无评估',w.reward_status==='verified'?'good':'')}${w.experience_revision?`<span class="small">经验修订 ${w.experience_revision}</span>`:''}</div>`).join('')}<div class="footer-note">${esc(s.acceptance||'')}。写回成功、步骤通过或程序评估，都不等于业务建议已见效或用户已验收。</div></div>`:'';return `<div class="step-head"><h3>${esc(s.title)}</h3>${badge(statusName(s.status),statusClass(s.status))}</div><p class="step-description">${esc(s.summary)}</p><div class="io-grid">${ioHtml(s.inputs,'INPUT · 输入',key+':in')}${ioHtml(s.outputs,'OUTPUT · 输出',key+':out')}</div>${decisionsHtml(s.decisions)}${s.errors?.length?`<div class="callout">历史修复记录：${s.errors.map(esc).join('；')}</div>`:''}${memory}${writes}${toolsHtml(s,key+':tools')}`}
function historyHtml(run){const key=state.caseId+':'+run.run_id+':history';return `<details class="history" data-open="${key}" ${state.open.has(key)?'open':''}><summary>查看完整 RSI 时间线 · ${run.timeline.length} 条事件</summary><div class="history-list">${run.timeline.map(e=>`<div class="history-row"><time>${when(e.time)}</time><div>${esc(e.title)}${e.detail?`<small>${esc(e.detail)}</small>`:''}</div></div>`).join('')}</div></details>`}
function defaultPair(c){const pairs=c.recipe_evolution?.pairs||[];return pairs.find(p=>p.after_score>p.before_score)||pairs[0]}
function traceChoices(c){const x=c.recipe_evolution,pairs=x?.pairs||[];let pair=pairs.find(p=>p.task_id===state.pairId)||defaultPair(c);state.pairId=pair?.task_id||'';const items=c.runs.map(r=>({...r,trace_id:r.run_id}));if(pair){items.push({...pair.before_trace,role:'RSI 前 · 原始 Recipe'}, {...pair.after_trace,role:'RSI 后 · '+(x.after_revision?'Recipe v'+x.after_revision:'候选 Recipe（未发布）')})}return {items,pair,selector:pairs.length?`<div class="metadata"><label for="trace-task">对照工单</label><select id="trace-task" style="max-width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px" aria-label="选择前后对照工单">${pairs.map(p=>`<option value="${esc(p.task_id)}" ${p.task_id===pair.task_id?'selected':''}>${esc(crop(p.title.replace(/^请审核这个仿真售后工单：/,''),62))} · ${p.before_passed} → ${p.after_passed} / ${p.total} 项通过</option>`).join('')}</select></div><div class="footer-note">选同一工单，再切换 RSI 前 / RSI 后，可逐步对照方法、交付和独立验收。正式任务保留触发、Memory 与学习流程。</div>`:''}}
function renderCase(){const c=state.data;if(!c)return;const choices=traceChoices(c);let run=choices.items.find(r=>r.trace_id===state.runId);if(!run){state.runId=choices.pair?.before_trace.trace_id||c.comparison.after_run_id||c.runs.at(-1)?.run_id;run=choices.items.find(r=>r.trace_id===state.runId)}if(!run)return;const stages=expandedStages(run);if(!stages.some(s=>s.id===state.stepId))state.stepId=stages.find(s=>s.id.startsWith('decision:'))?.id||stages[0].id;const current=stages.find(s=>s.id===state.stepId),allMain=c.deliverables.filter(isPrimary),aux=c.deliverables.filter(a=>!isPrimary(a));const y=window.scrollY;$('#content').innerHTML=`<div class="eyebrow">CASE / 业务任务</div><section class="heading"><div><h1>${esc(c.title)}</h1><p>${esc(crop(c.objective,195))}</p></div>${badge(statusName(c.status),statusClass(c.status))}</section><div class="metadata">${run.executor_model?`<span>执行器 ${esc(run.executor_model)}</span>`:""}<span>${c.runs.length} 次正式任务${c.recipe_evolution?.pairs.length?` · ${c.recipe_evolution.pairs.length*2} 次确认对照执行`:""}</span><span>${c.trace_coverage.tool_count} 条工具与执行说明</span><span>${c.trace_coverage.event_count} 条 RSI 事件</span><span>更新 ${when(c.updated_at)}</span>${run.recipe_id?`<button class="btn subtle" data-recipe-run="${esc(run.run_id)}">下载本次 Recipe · r${esc(run.recipe_revision)}</button>`:''}</div>${effectHtml(c)}${allMain.length?`<section class="panel"><div class="panel-head"><h2>业务交付物</h2><span class="small">点击直接阅读或预览</span></div><div class="files">${allMain.map(fileButton).join('')}</div>${aux.length?`<details class="history" data-open="${c.case_id+':deliverables'}"><summary>另有 ${aux.length} 个指标、核验与复算文件</summary><div class="files">${aux.map(fileButton).join('')}</div></details>`:''}</section>`:''}<h2 class="section-title" id="execution-trace">完整执行 Trace</h2>${choices.selector}<div class="run-tabs">${choices.items.map(r=>`<button class="run-tab ${r.trace_id===run.trace_id?'active':''}" data-run="${esc(r.trace_id)}"><strong>${esc(r.role)}${r.measurement?.period?' · '+esc(r.measurement.period):''}</strong><span>${statusName(r.status)}${r.measurement?' · '+r.measurement.seconds.toFixed(4)+' 秒':r.quality?' · '+r.quality.passed+'/'+r.quality.total+' 组通过':''}</span></button>`).join('')}</div><div class="footer-note">${esc(run.trace_note)}。选择一次执行，再逐步查看输入、决策和产物。</div><section class="flow-shell"><nav class="flow-nav" aria-label="流程步骤">${stages.map((s,i)=>`<button class="step-btn ${s.id===current.id?'active':''}" data-step="${esc(s.id)}"><span class="step-index ${statusClass(s.status)}">${['passed','completed'].includes(s.status)?'✓':i+1}</span><span><strong>${esc(s.title)}</strong><small>${esc(statusName(s.status))}</small></span></button>`).join('')}</nav><div class="step-body">${stepHtml(current,run)}</div></section>${run.timeline?.length?`<section class="panel">${historyHtml(run)}</section>`:""}<div class="footer-note">${run.source==='harness_evaluation'?'当前评测编号':'当前执行编号'}：${esc(run.trace_id)} · 展示已持久化的事实；未记录的内容不会补造。</div>`;wireDetails();window.scrollTo(0,y)}
function wireDetails(){document.querySelectorAll('details[data-open]').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)state.open.add(d.dataset.open);else state.open.delete(d.dataset.open)}))}
async function loadCase(id,choose=false){const request=++state.request;const data=await api('/v1/cases/'+encodeURIComponent(id));if(request!==state.request||id!==state.caseId)return;const serialized=JSON.stringify(data);if(serialized===state.last&&!choose)return;state.last=serialized;state.data=data;if(choose){state.pairId='';state.runId=defaultPair(data)?.before_trace.trace_id||data.comparison.after_run_id||data.runs.at(-1)?.run_id;state.stepId=''}renderCase()}
async function refresh(){if(!state.token||state.busy)return;state.busy=true;try{const result=await api('/v1/cases?limit=200');state.cases=result.items;$('#connection').textContent='● 已连接 · 每 5 秒同步';message('');if(!state.cases.some(c=>c.case_id===state.caseId)){state.caseId=state.cases[0]?.case_id||'';state.last='';state.data=null}renderCases();if(state.caseId)await loadCase(state.caseId);else $('#content').innerHTML='<div class="placeholder">还没有 Case。通过 Codex 发起 RSI 任务后，可在此查看完整过程。</div>'}catch(e){message(e.message);$('#connection').textContent='连接异常'}finally{state.busy=false}}
function inline(text){return esc(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function markdown(source){const lines=source.split('\n'),out=[];let i=0;while(i<lines.length){const line=lines[i];if(line.startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}if(!line.trim()){i++;continue}if(/^\s*\|/.test(line)&&i+1<lines.length&&/^\s*\|?\s*:?-+/.test(lines[i+1])){const split=s=>s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());const head=split(line);i+=2;let rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push(split(lines[i++]));out.push('<div class="table-scroll"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}if(/^#{1,6} /.test(line)){const n=Math.min(4,line.match(/^#+/)[0].length+1);out.push(`<h${n}>${inline(line.replace(/^#+ /,''))}</h${n}>`);i++;continue}if(/^\s*(?:[-*]|\d+\.) /.test(line)){let rows=[];while(i<lines.length&&/^\s*(?:[-*]|\d+\.) /.test(lines[i]))rows.push(lines[i++].replace(/^\s*(?:[-*]|\d+\.) /,''));out.push('<ul>'+rows.map(v=>'<li>'+inline(v)+'</li>').join('')+'</ul>');continue}out.push('<p>'+inline(line)+'</p>');i++}return out.join('')}
const columnNames={period:'月份',country:'客户国家',raw_rows:'原始行',excluded_rows:'排除行',eligible_rows:'纳入行',gross_positive_gbp:'正向记账 GBP',credit_abs_gbp:'负向记账 GBP',net_gbp:'净记账 GBP',cancel_credit_gbp:'取消相关负向额 GBP',positive_order_count:'正向订单数',known_customer_count:'已识别客户',repeat_customer_count:'重复下单客户',repeat_customer_rate:'当月重复下单率'};
async function preview(id){const caseId=state.caseId;const modal=$('#artifact-modal');$('#artifact-title').textContent='加载交付物';$('#artifact-content').innerHTML='<div class="muted">正在读取…</div>';if(!modal.open)modal.showModal();try{const a=await api('/v1/cases/'+encodeURIComponent(caseId)+'/artifacts/'+encodeURIComponent(id));if(caseId!==state.caseId)return;$('#artifact-title').textContent=a.name;const body=$('#artifact-content');if(a.kind==='html'){body.innerHTML='<div class="muted" style="margin-bottom:12px">在隔离的预览中打开，无法访问主页面令牌或联网。</div>';const frame=document.createElement('iframe');frame.setAttribute('sandbox','allow-scripts');frame.setAttribute('referrerpolicy','no-referrer');frame.title=a.name;const csp='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data:; font-src data:; connect-src \'none\'; form-action \'none\'; base-uri \'none\'">';frame.srcdoc=/<head[^>]*>/i.test(a.content)?a.content.replace(/<head[^>]*>/i,m=>m+csp):csp+a.content;body.append(frame)}else if(a.kind==='markdown')body.innerHTML='<article class="doc">'+markdown(a.content)+'</article>';else if(a.kind==='csv'){body.innerHTML=`<p class="muted">共 ${a.row_count} 行${a.row_count>a.rows.length?'，预览前 '+a.rows.length+' 行':''}。货币显示值保留原始精度。</p><div class="table-scroll"><table class="data-table"><thead><tr>${a.columns.map(c=>'<th>'+esc(columnNames[c]||c)+'</th>').join('')}</tr></thead><tbody>${a.rows.map(r=>'<tr>'+a.columns.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}else if(a.kind==='record'){body.innerHTML='<p class="muted">'+esc(a.summary)+'</p><div class="facts">'+a.highlights.map(f=>`<div class="fact"><label>${esc(f.label)}</label><strong>${esc(f.value)}</strong></div>`).join('')+'</div>'+(a.notes||[]).map(n=>'<p class="muted">'+esc(n)+'</p>').join('')}else body.innerHTML='<pre class="plain-text">'+esc(a.content||'无可展示正文')+'</pre>'}catch(e){$('#artifact-content').textContent=e.message}}
function chooseTracePair(id){state.pairId=id;const pair=state.data?.recipe_evolution?.pairs.find(p=>p.task_id===id);state.runId=pair?.before_trace.trace_id||'';state.stepId='';renderCase()}
document.addEventListener('change',event=>{if(event.target.id==='trace-task')chooseTracePair(event.target.value)});
document.addEventListener('click',async event=>{const pairLink=event.target.closest('[data-trace-pair]');if(pairLink){chooseTracePair(pairLink.dataset.tracePair);$('#execution-trace').scrollIntoView({block:'start'});return}const candidate=event.target.closest('[data-candidate-recipe]');if(candidate){try{await downloadCandidateRecipe(candidate.dataset.candidateRecipe)}catch(e){message(e.message)}return}const recipe=event.target.closest('[data-recipe-run]');if(recipe){try{await downloadRecipe(recipe.dataset.recipeRun)}catch(e){message(e.message)}return}const artifact=event.target.closest('[data-artifact]');if(artifact){preview(artifact.dataset.artifact);return}const chosen=event.target.closest('[data-case]');if(chosen){state.caseId=chosen.dataset.case;state.last='';state.stepId='';renderCases();try{await loadCase(state.caseId,true)}catch(e){message(e.message)}return}const run=event.target.closest('[data-run]');if(run){state.runId=run.dataset.run;state.stepId='';renderCase();return}const step=event.target.closest('[data-step]');if(step){state.stepId=step.dataset.step;renderCase()}});
$('#connect').onclick=async()=>{state.token=$('#token').value.trim();if(!state.token)return;localStorage.setItem('cosens.rsi.token',state.token);await refresh();if($('#notice').hidden)$('#settings').open=false};
$('#logout').onclick=()=>{localStorage.removeItem('cosens.rsi.token');state.token='';$('#token').value='';state.data=null;state.cases=[];state.caseId='';state.last='';renderCases();$('#connection').textContent='未连接';$('#content').innerHTML='<div class="placeholder">已断开连接，请重新输入访问令牌。</div>'};
$('#refresh').onclick=refresh;$('#search').oninput=renderCases;$('#token').addEventListener('keydown',e=>{if(e.key==='Enter')$('#connect').click()});$('#close-modal').onclick=()=>$('#artifact-modal').close();$('#artifact-modal').addEventListener('click',e=>{if(e.target===$('#artifact-modal'))$('#artifact-modal').close()});$('#token').value=state.token;if(state.token)refresh();else $('#settings').open=true;setInterval(refresh,5000);
</script>
